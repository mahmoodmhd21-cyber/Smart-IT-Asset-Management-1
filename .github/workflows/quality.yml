name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend -- --max-warnings=0
      - run: npm run build --prefix frontend
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix frontend --audit-level=moderate
      - name: Install MongoDB and browser test tools
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse' | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-org-server
          npm install --prefix /tmp/smart-it-qa-tools playwright @axe-core/playwright
          /tmp/smart-it-qa-tools/node_modules/.bin/playwright install --with-deps chrome
      - name: Regression and release checks
        env:
          QA_BROWSER: '1'
          QA_PLAYWRIGHT: /tmp/smart-it-qa-tools/node_modules/playwright
        run: node tests/qa/run-command.cjs 600 node --test --test-concurrency=1 tests/*.test.cjs tests/assetStatus.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-evidence
          path: artifacts/qa/release
